<!DOCTYPE html>
<html>
<head><title>Engine Tests — LMSR vs L2-norm (smooth kernel)</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
  .suite { margin: 12px 0 4px; font-weight: bold; color: #94a3b8; }
  .pass { color: #22c55e; }
  .fail { color: #ef4444; font-weight: bold; }
  .summary { margin-top: 16px; font-size: 1.2em; padding: 8px; border-top: 1px solid #334155; }
</style>
</head>
<body>
<div id="output"></div>
<script src="engines/core.js"></script>
<script src="engines/l2.js"></script>
<script src="engines/lmsr.js"></script>
<script src="engines/dual.js"></script>
<script src="comparison.js"></script>
<script>
(function () {
  var pass = 0, fail = 0;
  var outputEl = document.getElementById('output');

  function log(html) { if (outputEl) outputEl.innerHTML += html + '<br>'; }
  function suite(name) { log('<div class="suite">--- ' + name + ' ---</div>'); console.log('\n--- ' + name + ' ---'); }
  function assert(cond, msg) {
    if (cond) { pass++; log('<span class="pass">  PASS</span>: ' + msg); console.log('  PASS: ' + msg); }
    else { fail++; log('<span class="fail">  FAIL</span>: ' + msg); console.error('  FAIL: ' + msg); }
  }
  function near(a, b, eps) { return Math.abs(a - b) < (eps || 0.01); }
  function rel(a, b, tol) { return Math.abs(a - b) <= (tol || 1e-6) * Math.max(1, Math.abs(b)); }
  function sumArray(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return s; }
  function maxArray(arr) { var m = -Infinity; for (var i = 0; i < arr.length; i++) if (arr[i] > m) m = arr[i]; return m; }
  function l2k(market) { var s = 0; for (var j = 0; j < market.N; j++) s += market.positions[j] * market.positions[j]; return Math.sqrt(s); }

  // ============================================================
  // 1. Initialization — both engines start uniform & lock same collateral
  // ============================================================
  suite('1. Initialization');
  var dm = new DualMarket();
  dm.init(32, 0, 100, 10000, { tradeFeeBps: 0 }, 3);

  assert(dm.lmsr instanceof LmsrMarket, 'current slot is LmsrMarket');
  assert(dm.l2 instanceof L2Market, 'improved slot is L2Market');
  assert(dm.lmsr.N === 32 && dm.l2.N === 32, 'N = 32 both');
  assert(near(dm.lmsr.getPool(), 10000), 'LMSR pool = liquidity at start');
  assert(near(dm.l2.getPool(), 10000), 'L2 pool (k) = liquidity at start');
  assert(near(dm.lmsr.b, 10000 / Math.log(32)), 'LMSR b = liquidity / ln(N)');
  assert(dm.l2.kernelWidth === 3 && dm.lmsr.kernelWidth === 3, 'both engines carry kernel width');

  var cProbs = dm.lmsr.getProbabilities();
  var iProbs = dm.l2.getProbabilities();
  assert(near(sumArray(cProbs), 1, 1e-6), 'LMSR probs sum to 1');
  assert(near(sumArray(iProbs), 1, 1e-6), 'L2 probs sum to 1');
  assert(near(cProbs[0], 1 / 32, 1e-6), 'LMSR uniform start = 1/N');
  assert(near(iProbs[0], 1 / 32, 1e-6), 'L2 uniform start = 1/N');
  assert(near(l2k(dm.l2), 10000), 'L2 invariant sqrt(sum x^2) = k');

  var labels = dm.lmsr.getLabels();
  assert(labels.length === 32 && labels[0] === '0-3', 'labels correct (shared)');

  // ============================================================
  // 2. LMSR cost-function primitives
  // ============================================================
  suite('2. LMSR primitives');
  var N = 16, L = 100000, b = L / Math.log(N);
  var qz = []; for (var i = 0; i < N; i++) qz.push(0);
  assert(near(lmsrCost(qz, b), b * Math.log(N)), 'C(0;b) = b·ln(N) = liquidity');
  var pz = lmsrPrices(qz, b);
  assert(near(pz[0], 1 / N, 1e-9), 'softmax(0) = uniform');
  // monotone b solve: find b for a target vault
  var q1 = qz.slice(); q1[5] = 40000;
  var target = lmsrCost(q1, b) + 12345;
  var bb = lmsrSolveB(q1, target);
  assert(rel(lmsrCost(q1, bb), target, 1e-7), 'lmsrSolveB hits target vault');
  assert(bb > b, 'solveB: larger target ⇒ larger b (deeper)');
  // entropy: increasing b pulls prices toward uniform
  var pLow = lmsrPrices(q1, b), pHigh = lmsrPrices(q1, bb);
  assert(maxArray(pHigh) < maxArray(pLow), 'larger b ⇒ flatter prices (toward uniform)');
  // cost >= max q (solvency floor)
  assert(lmsrCost(q1, b) >= maxArray(q1) - 1e-6, 'C(q;b) >= max q_i (solvency floor)');

  // ============================================================
  // 3. LMSR buy / sell mechanics
  // ============================================================
  suite('3. LMSR buy/sell');
  var lm = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { t: { wallet: 1e9 } };
  var pool0 = lm.getPool();
  var rb = lm.discreteBuy('t', 8, 5000);
  assert(near(lm.getPool() - pool0, 5000), 'LMSR buy grows vault by exactly net collateral');
  assert(rb.tokensOut > 0, 'LMSR buy returns positive tokens');
  assert(lm.getProbabilities()[8] > 1 / N, 'LMSR buy raises that bin price');
  // reversibility (0 fee): sell exact tokens returns exact cost
  var rs = lm.discreteSell('t', 8, rb.tokensOut);
  assert(near(rs.grossOut, 5000, 0.01), 'LMSR sell-back of exact tokens returns the cost (0 fee reversible)');
  assert(near(lm.getPool(), pool0, 0.01), 'LMSR vault returns to start after round-trip');

  // ============================================================
  // 4. L2-norm buy / sell mechanics
  // ============================================================
  suite('4. L2-norm buy/sell');
  var l2 = new L2Market(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { t: { wallet: 1e9 } };
  var k0 = l2.getPool();
  var rb2 = l2.discreteBuy('t', 8, 5000);
  assert(near(l2.getPool() - k0, 5000), 'L2 buy grows k by net collateral');
  assert(near(l2k(l2), l2.k), 'L2 invariant holds after buy');
  assert(l2.getProbabilities()[8] > 1 / N, 'L2 buy raises that bin price');
  var rs2 = l2.discreteSell('t', 8, rb2.tokensOut);
  assert(near(rs2.grossOut, 5000, 0.01), 'L2 sell-back returns cost (reversible)');
  assert(near(l2.getPool(), k0, 0.01), 'L2 k returns to start after round-trip');

  // both engines: same collateral buys DIFFERENT token amounts (the whole point)
  assert(Math.abs(rb.tokensOut - rb2.tokensOut) > 1, 'LMSR and L2 yield different tokens for same spend');

  // ============================================================
  // 5. Distribution buy — spends exact collateral on both AMMs
  // ============================================================
  suite('5. Distribution buy');
  function freshDual() { var d = new DualMarket(); d.init(N, 0, 100, L, { tradeFeeBps: 0 }, 3); d.addTrader('a', 1e9); return d; }
  var d5 = freshDual();
  var cPoolB = d5.lmsr.getPool(), iPoolB = d5.l2.getPool();
  var r5 = d5.distributionBuy('a', 50, 12, 8000);
  assert(!r5.error, 'dist buy ok');
  assert(near(d5.lmsr.getPool() - cPoolB, 8000, 0.05), 'LMSR dist buy grows vault by net');
  assert(near(d5.l2.getPool() - iPoolB, 8000, 0.05), 'L2 dist buy grows vault by net');
  assert(near(sumArray(r5.lmsr.tokensPerBin), r5.lmsr.totalTokens, 0.01), 'LMSR tokensPerBin sum = totalTokens');
  // gaussian shape: peak token bin near mu (bin 8 for mu=50, range 0-100, N=16)
  var cPeak = 0, cPeakBin = 0; for (var j = 0; j < N; j++) if (r5.lmsr.tokensPerBin[j] > cPeak) { cPeak = r5.lmsr.tokensPerBin[j]; cPeakBin = j; }
  assert(Math.abs(cPeakBin - 8) <= 1, 'LMSR dist buy peaks near mu');

  // ============================================================
  // 6. Distribution sell + sellAll
  // ============================================================
  suite('6. Distribution sell / sellAll');
  var d6 = freshDual();
  d6.distributionBuy('a', 50, 12, 8000);
  var cHoldBefore = sumArray(d6.lmsr.traderHoldings['a'].holdings);
  var rsell = d6.sellAll('a');
  assert(!rsell.error, 'sellAll ok');
  assert(near(sumArray(d6.lmsr.traderHoldings['a'].holdings), 0, 0.01), 'LMSR holdings zeroed after sellAll');
  assert(near(sumArray(d6.l2.traderHoldings['a'].holdings), 0, 0.01), 'L2 holdings zeroed after sellAll');
  assert(near(d6.lmsr.getPool(), L, 0.1), 'LMSR vault back to start after full buy+sellAll (0 fee)');
  assert(near(d6.l2.getPool(), L, 0.1), 'L2 vault back to start after full buy+sellAll (0 fee)');
  assert(cHoldBefore > 0, 'had holdings before sellAll');

  // ============================================================
  // 7. Fees (trade fee, LP fee share, redemption fee)
  // ============================================================
  suite('7. Fees');
  var lmF = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 200, lpFeeSharePct: 50, redemptionFeeBps: 100 });
  globalTraders = { t: { wallet: 1e9 } };
  var p0 = lmF.getPool();
  var rf = lmF.discreteBuy('t', 8, 10000);
  assert(rf.fee === 200, 'LMSR trade fee = 2% of gross');
  assert(rf.lpFee === 100, 'LMSR lpFee = 50% of fee');
  assert(near(lmF.getPool() - p0, 9800), 'LMSR vault grows by net (gross − fee)');
  assert(near(lmF.accumulatedLpFees, 100), 'LMSR accumulated LP fees tracked');
  // with fees, buy then sell strictly loses
  var lmF2 = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 200 });
  globalTraders = { t: { wallet: 1e9 } };
  var bk = lmF2.discreteBuy('t', 8, 10000);
  var sk = lmF2.discreteSell('t', 8, bk.tokensOut);
  assert(sk.collateralOut < 10000, 'LMSR buy→sell with fee returns less than cost (strict loss)');

  // ============================================================
  // 8. Shared settlement kernel shape
  // ============================================================
  suite('8. Kernel shape (shared)');
  var ek = new L2Market(11, 0, 110, L, { kernelWidth: 3 });
  var ker = ek.getSettlementKernel(5);
  assert(near(ker[5], 1), 'kernel peak = 1 at winning bin');
  assert(near(ker[4], ker[6]), 'kernel symmetric');
  assert(ker[4] > ker[3] && ker[3] > ker[2], 'kernel decays with distance');
  assert(near(ker[1], 0) && near(ker[9], 0), 'kernel zero beyond width');
  var ekL = new LmsrMarket(11, 0, 110, L, { kernelWidth: 3 });
  var kerL = ekL.getSettlementKernel(5);
  assert(near(ker[4], kerL[4]) && near(ker[2], kerL[2]), 'kernel identical across engines');
  // W=0 ⇒ winner-takes-all
  var ek0 = new L2Market(11, 0, 110, L, { kernelWidth: 0 });
  var ker0 = ek0.getSettlementKernel(5);
  assert(near(ker0[5], 1) && near(ker0[4], 0) && near(ker0[6], 0), 'W=0 ⇒ only winning bin pays (WTA)');

  // ============================================================
  // 9. Resolve conservation (pool = Σ trader gross + LP residual)
  // ============================================================
  suite('9. Resolve conservation');
  function conservationCheck(engineName, engine, winBin) {
    var pool = engine.getPool();
    var res = engine.resolve(winBin);
    var traderGross = 0;
    for (var i = 0; i < res.payouts.length; i++) if (res.payouts[i].type === 'Trader') traderGross += res.payouts[i].grossPayout;
    assert(near(traderGross + res.lpResidual, pool, Math.max(1, pool * 1e-6)),
      engineName + ' conservation: Σ trader gross + LP residual = pool');
  }
  var d9 = freshDual();
  d9.distributionBuy('a', 30, 10, 9000);
  d9.distributionBuy('a', 70, 8, 7000);
  // snapshot pools before resolving (resolve mutates resolved flag only)
  conservationCheck('LMSR', d9.lmsr, 40);
  conservationCheck('L2', d9.l2, 40);

  // ============================================================
  // 10. Solvency (claimScale ≤ 1, scaled claims ≤ pool)
  // ============================================================
  suite('10. Solvency');
  function solvencyCheck(engineName, engine, winValue) {
    var pool = engine.getPool();
    var bin = Math.max(0, Math.min(engine.N - 1, Math.floor((winValue - engine.rangeMin) * engine.N / (engine.rangeMax - engine.rangeMin))));
    var kernel = engine.getSettlementKernel(bin);
    var totalClaim = 0;
    for (var nm in engine.traderHoldings) {
      var th = engine.traderHoldings[nm];
      for (var i = 0; i < engine.N; i++) totalClaim += th.holdings[i] * kernel[i];
    }
    var cs = (totalClaim > pool && totalClaim > 0) ? pool / totalClaim : 1;
    assert(cs <= 1 + 1e-9, engineName + ' claimScale ≤ 1 @ win=' + winValue);
    assert(totalClaim * cs <= pool + 1, engineName + ' scaled claims ≤ pool @ win=' + winValue);
  }
  // heavy concentrated buys to force claims > pool
  var d10 = new DualMarket(); d10.init(N, 0, 100, 5000, { tradeFeeBps: 0 }, 3); d10.addTrader('a', 1e9);
  for (var t10 = 0; t10 < 6; t10++) d10.distributionBuy('a', 50, 6, 9000);
  for (var wv = 10; wv <= 90; wv += 20) { solvencyCheck('LMSR', d10.lmsr, wv); solvencyCheck('L2', d10.l2, wv); }

  // ============================================================
  // 11. LP add/remove — L2 preserves probabilities (proportional)
  // ============================================================
  suite('11. L2 LP (proportional)');
  var l2lp = new L2Market(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { t: { wallet: 1e9 }, lp: { wallet: 1e9 } };
  l2lp.discreteBuy('t', 10, 20000);
  var probsBefore = l2lp.getProbabilities().slice();
  var kBefore = l2lp.getPool();
  var add = l2lp.addLiquidity('lp', 30000);
  assert(near(l2lp.getPool() - kBefore, 30000), 'L2 add grows k by deposit');
  var probsAfter = l2lp.getProbabilities();
  var maxProbDiff = 0; for (var j = 0; j < N; j++) maxProbDiff = Math.max(maxProbDiff, Math.abs(probsAfter[j] - probsBefore[j]));
  assert(maxProbDiff < 1e-6, 'L2 add preserves probability distribution');
  assert(add.sharesReceived > 0, 'L2 LP receives shares');

  // ============================================================
  // 12. LP add/remove — LMSR scales b (prices drift toward/away uniform)
  // ============================================================
  suite('12. LMSR LP (scale-b)');
  var lmlp = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { t: { wallet: 1e9 }, lp: { wallet: 1e9 } };
  lmlp.discreteBuy('t', 10, 30000);
  var maxProbBefore = maxArray(lmlp.getProbabilities());
  var bBefore = lmlp.b, poolBefore = lmlp.getPool();
  var addL = lmlp.addLiquidity('lp', 40000);
  assert(near(lmlp.getPool() - poolBefore, 40000, 0.5), 'LMSR add grows vault by deposit');
  assert(lmlp.b > bBefore, 'LMSR add increases b (deeper)');
  assert(maxArray(lmlp.getProbabilities()) < maxProbBefore, 'LMSR add drifts prices toward uniform');
  assert(addL.sharesReceived > 0, 'LMSR LP receives shares');
  // remove pushes back out
  var maxProbAfterAdd = maxArray(lmlp.getProbabilities());
  var bAfterAdd = lmlp.b;
  lmlp.removeLiquidity('lp', 40000);
  assert(lmlp.b < bAfterAdd, 'LMSR remove decreases b (shallower)');
  assert(maxArray(lmlp.getProbabilities()) > maxProbAfterAdd, 'LMSR remove drifts prices away from uniform');
  // LMSR add does NOT change trader holdings (q untouched)
  assert(near(lmlp.traderHoldings['t'].holdings[10], lmlp.traderHoldings['t'].holdings[10]), 'LMSR holdings intact through LP ops');

  // ============================================================
  // 13. LP portfolios
  // ============================================================
  suite('13. LP portfolios');
  var d13 = freshDual();
  d13.distributionBuy('a', 50, 10, 10000);
  var lpC = d13.lmsr.getLpPortfolio('Creator');
  var lpI = d13.l2.getLpPortfolio('Creator');
  assert(lpC && lpI, 'both LP portfolios returned');
  assert(near(lpC.currentValue, d13.lmsr.getPool(), 0.5), 'LMSR LP (sole) value = vault');
  assert(near(lpI.currentValue, d13.l2.getPool(), 0.5), 'L2 LP (sole) value = vault');
  assert(lpC.payoutPerOutcome.length === N && lpI.payoutPerOutcome.length === N, 'LP payout curves length N');
  var allC = d13.lmsr.getAllLpPortfolio();
  assert(near(allC.poolFraction, 1), 'getAllLpPortfolio fraction = 1');

  // ============================================================
  // 14. previewDistributionBuy matches executed trade
  // ============================================================
  suite('14. Preview parity');
  function previewParity(name, engine) {
    globalTraders = { z: { wallet: 1e9 } };
    var prev = engine.previewDistributionBuy(40, 9, 6000);
    var exec = engine.distributionBuy('z', 40, 9, 6000);
    assert(near(prev.totalTokens, exec.totalTokens, 0.01), name + ' preview totalTokens matches executed');
    assert(near(prev.peakPayout, exec.peakPayout, 0.01), name + ' preview peakPayout matches executed');
    assert(prev.peakBin === exec.peakBin, name + ' preview peakBin matches executed');
  }
  previewParity('LMSR', new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 }));
  previewParity('L2', new L2Market(N, 0, 100, L, { tradeFeeBps: 0 }));

  // LP add/remove preview must match the executed LP op (no NaN, incl. LMSR floor)
  function lpPreviewParity(name, engine) {
    globalTraders = { lpx: { wallet: 1e9 }, t: { wallet: 1e9 } };
    engine.distributionBuy('t', 50, 9, 7000);          // create some skew
    var addPrev = engine.previewAddLiquidity('lpx', 4000);
    assert(addPrev && isFinite(addPrev.newPool) && isFinite(addPrev.sharesReceived), name + ' add preview is finite (no NaN)');
    var poolBefore = engine.getPool();
    var addExec = engine.addLiquidity('lpx', 4000);
    assert(near(addPrev.sharesReceived, addExec.sharesReceived, 0.01), name + ' add preview shares match executed');
    assert(near(addPrev.newPool, engine.getPool(), 0.5), name + ' add preview newPool matches executed pool');
    assert(near(addPrev.newPool, poolBefore + 4000, 0.5), name + ' add grows vault by deposit');
    // remove preview parity
    var remPrev = engine.previewRemoveLiquidity('lpx', 2000);
    assert(remPrev && isFinite(remPrev.collateralOut) && isFinite(remPrev.sharesBurned), name + ' remove preview is finite (no NaN)');
    var remExec = engine.removeLiquidity('lpx', 2000);
    assert(near(remPrev.sharesBurned, remExec.sharesBurned, 0.01), name + ' remove preview shares match executed');
    assert(near(remPrev.collateralOut, remExec.collateralOut, 0.5), name + ' remove preview collateralOut matches executed');
    assert(near(remPrev.totalPayout, remExec.totalPayout, 0.5), name + ' remove preview totalPayout matches executed');
  }
  lpPreviewParity('LMSR', new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 30, lpFeeSharePct: 50 }));
  lpPreviewParity('L2', new L2Market(N, 0, 100, L, { tradeFeeBps: 30, lpFeeSharePct: 50 }));

  // ============================================================
  // 15. getTraderPayoutPerOutcome
  // ============================================================
  suite('15. Payout per outcome');
  var d15 = freshDual();
  d15.distributionBuy('a', 50, 8, 8000);
  var ppoC = d15.lmsr.getTraderPayoutPerOutcome('a');
  var ppoI = d15.l2.getTraderPayoutPerOutcome('a');
  assert(ppoC.length === N && ppoI.length === N, 'payout-per-outcome length N');
  assert(maxArray(ppoC) > 0 && maxArray(ppoI) > 0, 'payout-per-outcome positive somewhere');
  // peak payout outcome should be near mu bin
  var pb = 0, pv = 0; for (var j = 0; j < N; j++) if (ppoC[j] > pv) { pv = ppoC[j]; pb = j; }
  assert(Math.abs(pb - 8) <= 2, 'LMSR payout peaks near mu bin');

  // ============================================================
  // 16. Serialization roundtrip (incl. LMSR b)
  // ============================================================
  suite('16. Serialization');
  var d16 = freshDual();
  d16.distributionBuy('a', 60, 10, 9000);
  d16.addLiquidity('Creator', 5000);
  var json = d16.serialize();
  var d16b = DualMarket.loadFromSave(json);
  assert(near(d16b.lmsr.b, d16.lmsr.b, 1e-9), 'LMSR b survives serialize');
  assert(near(d16b.lmsr.getPool(), d16.lmsr.getPool(), 0.01), 'LMSR pool survives serialize');
  assert(near(d16b.l2.getPool(), d16.l2.getPool(), 0.01), 'L2 pool survives serialize');
  var ph1 = d16.lmsr.getProbabilities(), ph2 = d16b.lmsr.getProbabilities();
  var pdiff = 0; for (var j = 0; j < N; j++) pdiff = Math.max(pdiff, Math.abs(ph1[j] - ph2[j]));
  assert(pdiff < 1e-9, 'LMSR probabilities survive serialize');
  assert(near(d16b.lmsr.traderHoldings['a'].holdings[9], d16.lmsr.traderHoldings['a'].holdings[9], 0.01), 'holdings survive serialize');

  // ============================================================
  // 17. Bonding curve (sequential same-bin buys cost more per token)
  // ============================================================
  suite('17. Bonding curve');
  function bondingCheck(name, engine) {
    globalTraders = { z: { wallet: 1e9 } };
    var a = engine.discreteBuy('z', 8, 5000);
    var b2 = engine.discreteBuy('z', 8, 5000);
    assert(b2.tokensOut < a.tokensOut, name + ' second same-bin buy yields fewer tokens (price rises)');
  }
  bondingCheck('LMSR', new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 }));
  bondingCheck('L2', new L2Market(N, 0, 100, L, { tradeFeeBps: 0 }));

  // ============================================================
  // 18. verifySync reports divergence (informational)
  // ============================================================
  suite('18. verifySync (divergence report)');
  var d18 = freshDual();
  d18.discreteBuy('a', 10, 20000);
  var vs = d18.verifySync();
  assert(typeof vs.lmsrPool === 'number' && typeof vs.l2Pool === 'number', 'verifySync reports both pools');
  assert(vs.maxProbDiff > 0, 'verifySync reports nonzero prob divergence after trading');

  // ============================================================
  // 19. Utilities
  // ============================================================
  suite('19. Utilities');
  assert(formatCompact(1500) === '1.5K', 'formatCompact 1.5K');
  assert(formatCompact(2.5e6) === '2.5M', 'formatCompact 2.5M');
  assert(formatCompact(null) === '—', 'formatCompact null → dash');
  assert(formatPct(0.5) === '50.0%', 'formatPct 50%');
  assert(formatPnl(100).charAt(0) === '+', 'formatPnl positive has +');
  assert(formatPnl(-100).charAt(0) === '-', 'formatPnl negative has -');

  // ============================================================
  // 20. Wallet isolation across engines
  // ============================================================
  suite('20. Wallet isolation');
  var d20 = freshDual();
  var bal0 = d20.getTraderBalance('a');
  assert(bal0.lmsr === bal0.l2, 'wallets equal at start');
  d20.distributionBuy('a', 50, 10, 5000);
  var bal1 = d20.getTraderBalance('a');
  assert(near(bal1.lmsr, 1e9 - 5000) && near(bal1.l2, 1e9 - 5000), 'both wallets debited equally by spend');
  assert(bal1.lmsr === bal1.l2, 'wallets stay isolated but equal-cost on buy');

  // ============================================================
  // 21. Non-standard ranges
  // ============================================================
  suite('21. Non-standard ranges');
  var dn = new DualMarket(); dn.init(10, -100, -50, 50000, { tradeFeeBps: 0 }, 2); dn.addTrader('a', 1e9);
  assert(near(dn.lmsr.binWidth, 5), 'binWidth for [-100,-50]/10 = 5');
  assert(near(dn.lmsr.centers[0], -97.5), 'first center = -97.5');
  var rn = dn.distributionBuy('a', -75, 8, 6000);
  assert(!rn.error, 'dist buy ok in negative range');
  var resN = dn.lmsr.resolve(-75);
  assert(resN.winningBin === 5, 'resolve -75 in [-100,-50] = bin 5');

  // ============================================================
  // 22. Error handling
  // ============================================================
  suite('22. Error handling');
  var de = freshDual();
  globalTraders = { a: { wallet: 100 } };
  de.lmsr._setWallets;
  assert(de.lmsr.discreteBuy('a', 0, 1e12).error, 'buy beyond wallet errors (LMSR)');
  assert(de.lmsr.discreteBuy('a', -1, 100).error, 'invalid bin errors');
  assert(de.lmsr.discreteSell('a', 0, 1e9).error, 'oversell errors');
  de.lmsr.resolve(50);
  assert(de.lmsr.discreteBuy('a', 0, 10).error, 'buy after resolve errors');
  assert(de.lmsr.addLiquidity('a', 10).error, 'addLiquidity after resolve errors');

  // ============================================================
  // 23. LS-LMSR mode (pure Othman b = α·ΣQ)
  // ============================================================
  suite('23. LS-LMSR mode');
  var lsAlpha = 0.3 / (N * Math.log(N));
  function freshLs(fees) {
    var f = { tradeFeeBps: 0, lmsrMode: 'lslmsr', lsAlpha: lsAlpha };
    for (var k in (fees || {})) f[k] = fees[k];
    return new LmsrMarket(N, 0, 100, L, f);
  }
  // init: collateral-matched, uniform, seed>0
  var ls = freshLs();
  globalTraders = { t: { wallet: 1e9 }, lp: { wallet: 1e9 } };
  assert(ls.mode === 'lslmsr', 'mode flag set');
  assert(near(ls.getPool(), L, 1), 'LS init vault = liquidity (collateral-matched)');
  var lsP = ls.getProbabilities();
  assert(near(sumArray(lsP), 1, 1e-9) && near(lsP[0], 1 / N, 1e-9), 'LS init uniform prices, sum 1');
  assert(ls.seed > 0 && ls.alpha > 0, 'LS seed>0 and alpha>0');
  assert(near(ls.alpha, lsAlpha, 1e-15), 'LS alpha stored as given');
  // buy grows vault by net; raises price; reversible at 0 fee
  var lsPool0 = ls.getPool();
  var lsRb = ls.discreteBuy('t', 8, 5000);
  assert(near(ls.getPool() - lsPool0, 5000, 0.01), 'LS buy grows vault by exactly net');
  assert(lsRb.tokensOut > 0 && ls.getProbabilities()[8] > 1 / N, 'LS buy positive tokens, raises bin');
  var lsRs = ls.discreteSell('t', 8, lsRb.tokensOut);
  assert(near(lsRs.grossOut, 5000, 0.01) && near(ls.getPool(), lsPool0, 0.01), 'LS 0-fee buy/sell reversible');
  // LS differs from plain LMSR for the same spend
  globalTraders = { t: { wallet: 1e9 } };
  var plainOne = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 });
  var tPlain = plainOne.discreteBuy('t', 8, 5000).tokensOut;
  globalTraders = { t: { wallet: 1e9 } };
  var tLs = freshLs().discreteBuy('t', 8, 5000).tokensOut;
  assert(Math.abs(tPlain - tLs) > 1, 'LS-LMSR and plain LMSR yield different tokens for same spend');
  // LP add: vault grows by deposit, seed up, prices flatten toward uniform
  globalTraders = { t: { wallet: 1e9 }, lp: { wallet: 1e9 } };
  var ls2 = freshLs();
  ls2.discreteBuy('t', 8, 25000);
  var seedB = ls2.seed, poolB = ls2.getPool(), peakB = maxArray(ls2.getProbabilities());
  var lsAdd = ls2.addLiquidity('lp', 30000);
  assert(near(ls2.getPool() - poolB, 30000, 0.5), 'LS LP add grows vault by deposit');
  assert(ls2.seed > seedB, 'LS LP add raises seed (deeper)');
  assert(maxArray(ls2.getProbabilities()) < peakB, 'LS LP add flattens prices toward uniform');
  assert(lsAdd.sharesReceived > 0, 'LS LP add issues shares');
  // LP remove: vault drops by collateralOut, floored above min vault
  var poolR = ls2.getPool();
  var lsRem = ls2.removeLiquidity('lp', 15000);
  assert(near(ls2.getPool(), poolR - lsRem.collateralOut, 0.5), 'LS LP remove drops vault by collateralOut');
  assert(ls2.seed > 0, 'LS seed stays > 0 after remove (solvency floor)');
  // LP preview parity (add + remove), incl. fees
  globalTraders = { t: { wallet: 1e9 }, lp: { wallet: 1e9 } };
  var ls3 = freshLs({ tradeFeeBps: 30, lpFeeSharePct: 50 });
  ls3.distributionBuy('t', 55, 9, 8000);
  var apv = ls3.previewAddLiquidity('lp', 5000);
  var apx = ls3.addLiquidity('lp', 5000);
  assert(near(apv.sharesReceived, apx.sharesReceived, 0.01) && near(apv.newPool, ls3.getPool(), 0.5), 'LS add preview == executed');
  var rpv = ls3.previewRemoveLiquidity('lp', 3000);
  var rpx = ls3.removeLiquidity('lp', 3000);
  assert(near(rpv.collateralOut, rpx.collateralOut, 0.5) && near(rpv.sharesBurned, rpx.sharesBurned, 0.01), 'LS remove preview == executed');
  // solvency: claimScale <= 1 at every winning bin after skewed trades
  var ls4 = freshLs({ tradeFeeBps: 50, lpFeeSharePct: 40, redemptionFeeBps: 30, kernelWidth: 3 });
  globalTraders = { t: { wallet: 1e9 }, u: { wallet: 1e9 } };
  ls4.distributionBuy('t', 35, 7, 60000);
  ls4.distributionBuy('u', 75, 6, 90000);
  var lsWorst = 0;
  for (var w = 0; w < N; w++) { var rr = ls4.resolve((w + 0.5) * 100 / N); lsWorst = Math.max(lsWorst, rr.claimScale); ls4.resolved = false; }
  assert(lsWorst <= 1 + 1e-9, 'LS claimScale <= 1 at all win bins (solvent)');
  // resolve conservation: pool + accLpFees == Σ payouts
  var ls5 = freshLs({ tradeFeeBps: 40, lpFeeSharePct: 50, redemptionFeeBps: 20, kernelWidth: 2 });
  globalTraders = { t: { wallet: 1e9 }, u: { wallet: 1e9 } };
  ls5.distributionBuy('t', 45, 8, 50000);
  ls5.distributionBuy('u', 60, 10, 40000);
  var ls5PoolPlusFees = ls5.getPool() + ls5.accumulatedLpFees;
  var ls5res = ls5.resolve(50);
  var ls5paid = 0; for (var pi = 0; pi < ls5res.payouts.length; pi++) ls5paid += ls5res.payouts[pi].payout;
  assert(near(ls5PoolPlusFees, ls5paid, 0.5), 'LS resolve conservation: pool + accLpFees == Σ payouts');
  // serialize roundtrip preserves mode/alpha/seed/positions
  var lsd = new DualMarket(); lsd.init(N, 0, 100, L, { tradeFeeBps: 0, lmsrMode: 'lslmsr', lsSensitivity: 0.3 }, 3); lsd.addTrader('a', 1e9);
  lsd.distributionBuy('a', 50, 9, 9000); lsd.addLiquidity('Creator', 4000);
  var lsjson = lsd.serialize(); var lsd2 = DualMarket.loadFromSave(lsjson);
  assert(lsd2.lmsr.mode === 'lslmsr', 'LS mode survives serialize');
  assert(near(lsd2.lmsr.seed, lsd.lmsr.seed, 1e-6) && near(lsd2.lmsr.alpha, lsd.lmsr.alpha, 1e-15), 'LS seed+alpha survive serialize');
  assert(near(lsd2.lmsr.getPool(), lsd.lmsr.getPool(), 0.01), 'LS pool survives serialize');
  assert(lsd2.initConfig.fees.lmsrMode === 'lslmsr' && near(lsd2.initConfig.fees.lsSensitivity, 0.3, 1e-9), 'LS initConfig fees survive (UI restore)');

  // ============================================================
  // 24. Solvency-aware peak payout (previewPeakPayout)
  // ============================================================
  suite('24. previewPeakPayout (solvency toggle)');
  // (a) solvencyAware=false reproduces the engine's raw peakPayout exactly
  function peakRawParity(name, engine) {
    globalTraders = { z: { wallet: 1e12 } };
    var prev = engine.previewDistributionBuy(45, 9, 7000);
    var net = prev.cost - prev.fee;
    var pk = engine.previewPeakPayout(prev.tokensPerBin, net, false);
    assert(near(pk.peakPayout, prev.peakPayout, 0.01), name + ' previewPeakPayout(false) == engine peakPayout');
    assert(pk.peakBin === prev.peakBin, name + ' previewPeakPayout(false) peakBin matches');
  }
  peakRawParity('LMSR', new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 }));
  peakRawParity('L2', new L2Market(N, 0, 100, L, { tradeFeeBps: 0 }));

  // (b) when claims fit in the pool, solvency-aware == raw (claimScale=1)
  var sa1 = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { z: { wallet: 1e12 } };
  var sp1 = sa1.previewDistributionBuy(50, 8, 3000);
  var rawA = sa1.previewPeakPayout(sp1.tokensPerBin, 3000, false);
  var solA = sa1.previewPeakPayout(sp1.tokensPerBin, 3000, true);
  assert(near(rawA.peakPayout, solA.peakPayout, 0.01), 'solvency==raw when pool covers claims (small trade)');

  // (c) when claims exceed the pool, solvency-aware < raw, and matches actual resolve
  var sa2 = new LmsrMarket(N, 0, 100, 5000, { tradeFeeBps: 0 });
  globalTraders = { z: { wallet: 1e12 } };
  for (var i24 = 0; i24 < 5; i24++) sa2.distributionBuy('z', 50, 5, 9000); // pile up -> claims > pool
  var sp2 = sa2.previewDistributionBuy(50, 5, 9000);
  var net2 = sp2.cost - sp2.fee;
  var raw2 = sa2.previewPeakPayout(sp2.tokensPerBin, net2, false);
  var sol2 = sa2.previewPeakPayout(sp2.tokensPerBin, net2, true);
  assert(sol2.peakPayout < raw2.peakPayout, 'solvency-aware peak < raw peak when claims exceed pool');
  // execute the trade then resolve at the solvency-aware peak bin; the marginal
  // payout from this trade's tokens should be <= the solvency-aware preview.
  var holdBefore = sa2.traderHoldings['z'].holdings.slice();
  sa2.distributionBuy('z', 50, 5, 9000);
  var resB = sa2.resolve((sol2.peakBin + 0.5) * 100 / N);
  assert(resB.claimScale <= 1, 'resolve claimScale <= 1 in over-claim scenario');
  assert(sol2.peakPayout <= raw2.peakPayout + 1e-6, 'solvency-aware peak is a valid (capped) bound');

  // (d) L2 too: solvency-aware never exceeds raw
  var sa3 = new L2Market(N, 0, 100, 5000, { tradeFeeBps: 0 });
  globalTraders = { z: { wallet: 1e12 } };
  for (var j24 = 0; j24 < 5; j24++) sa3.distributionBuy('z', 50, 5, 9000);
  var sp3 = sa3.previewDistributionBuy(50, 5, 9000);
  var raw3 = sa3.previewPeakPayout(sp3.tokensPerBin, sp3.cost - sp3.fee, false);
  var sol3 = sa3.previewPeakPayout(sp3.tokensPerBin, sp3.cost - sp3.fee, true);
  assert(sol3.peakPayout <= raw3.peakPayout + 1e-6, 'L2 solvency-aware peak <= raw peak');

  // (e) getTraderPortfolio(solvencyAware) caps every payout-derived figure
  var pf = new LmsrMarket(N, 0, 100, 5000, { tradeFeeBps: 0 });
  globalTraders = { z: { wallet: 1e12 } };
  for (var p24 = 0; p24 < 5; p24++) pf.distributionBuy('z', 50, 5, 9000); // over-claim the pool
  var rawPort = pf.getTraderPortfolio('z', false);
  var solPort = pf.getTraderPortfolio('z', true);
  assert(solPort.peakPayout < rawPort.peakPayout, 'portfolio: solvency peakPayout < raw');
  assert(solPort.expectedPayout < rawPort.expectedPayout, 'portfolio: solvency E[payout] < raw');
  assert(solPort.unrealizedPnL < rawPort.unrealizedPnL, 'portfolio: solvency unrealizedPnL < raw (derived)');
  // default (no flag) is unchanged
  var defPort = pf.getTraderPortfolio('z');
  assert(near(defPort.peakPayout, rawPort.peakPayout, 1e-9), 'portfolio: default == raw (no flag)');
  // when pool covers claims, solvency == raw
  var pf2 = new LmsrMarket(N, 0, 100, L, { tradeFeeBps: 0 });
  globalTraders = { z: { wallet: 1e12 } };
  pf2.distributionBuy('z', 50, 8, 3000);
  var r2 = pf2.getTraderPortfolio('z', false), s2 = pf2.getTraderPortfolio('z', true);
  assert(near(r2.peakPayout, s2.peakPayout, 0.01) && near(r2.expectedPayout, s2.expectedPayout, 0.01),
    'portfolio: solvency == raw when pool covers claims');

  // ============================================================
  // SUMMARY
  // ============================================================
  log('<div class="summary">' + pass + ' passed, ' + fail + ' failed</div>');
  console.log('\n' + pass + ' passed, ' + fail + ' failed');
})();
</script>
