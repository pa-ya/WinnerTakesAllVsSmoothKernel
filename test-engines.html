<!DOCTYPE html>
<html>
<head><title>Engine Tests</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
  .suite { margin: 12px 0 4px; font-weight: bold; color: #94a3b8; }
  .pass { color: #22c55e; }
  .fail { color: #ef4444; font-weight: bold; }
  .summary { margin-top: 16px; font-size: 1.2em; padding: 8px; border-top: 1px solid #334155; }
</style>
</head>
<body>
<div id="output"></div>
<script src="comparison.js"></script>
<script>
(function () {
  var pass = 0, fail = 0;
  var outputEl = document.getElementById('output');

  function log(html) { outputEl.innerHTML += html + '<br>'; }
  function suite(name) { log('<div class="suite">--- ' + name + ' ---</div>'); console.log('\n--- ' + name + ' ---'); }

  function assert(cond, msg) {
    if (cond) { pass++; log('<span class="pass">  PASS</span>: ' + msg); console.log('  PASS: ' + msg); }
    else { fail++; log('<span class="fail">  FAIL</span>: ' + msg); console.error('  FAIL: ' + msg); }
  }

  function near(a, b, eps) { return Math.abs(a - b) < (eps || 0.01); }

  function sumArray(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i]; return s; }

  function ammInvariant(market) {
    var sumSq = 0;
    for (var j = 0; j < market.N; j++) sumSq += market.positions[j] * market.positions[j];
    return Math.sqrt(sumSq);
  }

  // ============================================================
  // 1. INITIALIZATION
  // ============================================================
  suite('1. Initialization');
  var dm = new DualMarket();
  dm.init(32, 0, 100, 10000, { tradeFeeBps: 0 }, 3);

  assert(dm.current.N === 32, 'Current N = 32');
  assert(dm.improved.N === 32, 'Improved N = 32');
  assert(near(dm.current.k, 10000), 'Current k = 10000');
  assert(near(dm.improved.k, 10000), 'Improved k = 10000');
  assert(dm.improved.kernelWidth === 3, 'Kernel width = 3');
  assert(dm.initialized === true, 'DualMarket initialized flag set');

  var sync = dm.verifySync();
  assert(sync.synced, 'Positions synced after init (drift=' + sync.maxPositionDrift.toFixed(6) + ')');

  var cProbs = dm.current.getProbabilities();
  var iProbs = dm.improved.getProbabilities();
  assert(near(sumArray(cProbs), 1, 0.001), 'Current probs sum to 1');
  assert(near(sumArray(iProbs), 1, 0.001), 'Improved probs sum to 1');
  assert(near(cProbs[0], 1 / 32, 0.001), 'Current uniform prob = 1/N');
  assert(near(iProbs[0], 1 / 32, 0.001), 'Improved uniform prob = 1/N');

  assert(near(ammInvariant(dm.current), 10000, 0.01), 'Current AMM invariant: sqrt(sum(x^2)) = k');
  assert(near(ammInvariant(dm.improved), 10000, 0.01), 'Improved AMM invariant: sqrt(sum(x^2)) = k');

  // Labels
  var labels = dm.current.getLabels();
  assert(labels.length === 32, 'Labels count = N');
  assert(labels[0] === '0-3', 'First label = 0-3');
  assert(labels[31] === '97-100', 'Last label = 97-100');

  // ============================================================
  // 2. DISCRETE BUY
  // ============================================================
  suite('2. Discrete buy');
  dm.addTrader('Alice', 50000);
  var buyResult = dm.discreteBuy('Alice', 10, 5000);
  assert(!buyResult.error, 'Dual buy succeeded');
  assert(near(buyResult.current.tokensOut, buyResult.improved.tokensOut, 0.001), 'TokensOut identical across engines');
  assert(buyResult.current.tokensOut > 0, 'Tokens received > 0');
  assert(buyResult.current.fee === 0, 'Fee = 0 when tradeFeeBps = 0');

  sync = dm.verifySync();
  assert(sync.synced, 'Positions synced after buy');
  assert(near(ammInvariant(dm.current), dm.current.k, 0.01), 'AMM invariant holds after buy');

  // Prob shifted
  var probsAfter = dm.current.getProbabilities();
  assert(probsAfter[10] > 1 / 32, 'Bought bin probability increased');
  assert(near(sumArray(probsAfter), 1, 0.001), 'Probs still sum to 1 after buy');

  // Wallet deducted
  var bal = dm.getTraderBalance('Alice');
  assert(near(bal.current, 45000), 'Current wallet = 45000');
  assert(near(bal.improved, 45000), 'Improved wallet = 45000');

  // Probs differ between engines (quadratic vs linear)
  var iProbs2 = dm.improved.getProbabilities();
  assert(!near(probsAfter[10], iProbs2[10], 0.001), 'Prob formulas differ: current=' + probsAfter[10].toFixed(6) + ' improved=' + iProbs2[10].toFixed(6));

  // ============================================================
  // 3. DISCRETE SELL
  // ============================================================
  suite('3. Discrete sell');
  var sellResult = dm.discreteSell('Alice', 10, 1000);
  assert(!sellResult.error, 'Dual sell succeeded');
  assert(near(sellResult.current.collateralOut, sellResult.improved.collateralOut, 0.001), 'Sell collateralOut identical');
  assert(sellResult.current.collateralOut > 0, 'CollateralOut > 0');

  sync = dm.verifySync();
  assert(sync.synced, 'Positions synced after sell');
  assert(near(ammInvariant(dm.current), dm.current.k, 0.01), 'AMM invariant holds after sell');

  // ============================================================
  // 4. DISTRIBUTION BUY
  // ============================================================
  suite('4. Distribution buy');
  dm.addTrader('Bob', 30000);
  var distBuy = dm.distributionBuy('Bob', 50, 10, 8000);
  assert(!distBuy.error, 'Dist buy succeeded');
  assert(near(distBuy.current.totalTokens, distBuy.improved.totalTokens, 0.001), 'Dist buy totalTokens identical');
  assert(distBuy.current.tokensPerBin.length === 32, 'tokensPerBin has N entries');

  // Gaussian shape: peak near mu=50, bin 16 (center of range)
  var peakBin = distBuy.current.peakBin;
  assert(peakBin >= 14 && peakBin <= 18, 'Peak bin near mu=50 (bin ' + peakBin + ')');

  // Bins far from mu should get fewer tokens
  assert(distBuy.current.tokensPerBin[peakBin] > distBuy.current.tokensPerBin[0], 'Peak bin gets more tokens than edge bin');

  sync = dm.verifySync();
  assert(sync.synced, 'Positions synced after dist buy');

  // ============================================================
  // 5. DISTRIBUTION SELL
  // ============================================================
  suite('5. Distribution sell');
  var distSell = dm.distributionSell('Bob', 50, 10, 2000);
  assert(!distSell.error, 'Dist sell succeeded');
  assert(near(distSell.current.collateralOut, distSell.improved.collateralOut, 0.001), 'Dist sell collateralOut identical');
  assert(distSell.current.totalSold > 0, 'totalSold > 0');

  sync = dm.verifySync();
  assert(sync.synced, 'Positions synced after dist sell');

  // ============================================================
  // 6. SELL ALL
  // ============================================================
  suite('6. Sell all');
  var dm6 = new DualMarket();
  dm6.init(16, 0, 100, 5000, {}, 2);
  dm6.addTrader('Eve', 10000);
  dm6.discreteBuy('Eve', 5, 2000);
  dm6.distributionBuy('Eve', 60, 15, 3000);
  var kBefore = dm6.current.k;
  var sellAllResult = dm6.sellAll('Eve');
  assert(!sellAllResult.error, 'Sell all succeeded');
  assert(near(sellAllResult.current.collateralOut, sellAllResult.improved.collateralOut, 0.01), 'Sell all collateralOut identical');
  assert(sellAllResult.current.tokensReturned > 0, 'Tokens returned > 0');

  // After sell all, trader should have 0 holdings
  var eveTh = dm6.current.traderHoldings['Eve'];
  var totalRemaining = 0;
  for (var j = 0; j < 16; j++) totalRemaining += eveTh.holdings[j];
  assert(near(totalRemaining, 0, 0.001), 'All holdings zeroed after sell all');
  assert(near(ammInvariant(dm6.current), dm6.current.k, 0.01), 'AMM invariant holds after sell all');

  // k should decrease (collateral returned)
  assert(dm6.current.k < kBefore, 'k decreased after sell all');

  // Wallet should have received collateral
  var eveBal = dm6.getTraderBalance('Eve');
  assert(eveBal.current > 0, 'Wallet has collateral after sell all');

  // ============================================================
  // 7. RESOLUTION — WTA vs KERNEL
  // ============================================================
  suite('7. Resolution — WTA vs Kernel');
  var resolveResult = dm.resolve(50);
  assert(!resolveResult.error, 'Resolve succeeded');
  assert(resolveResult.current.winningBin === resolveResult.improved.winningBin, 'Same winning bin');

  // Vault identity: all payouts sum to k
  var cPayouts = resolveResult.current.payouts;
  var iPayouts = resolveResult.improved.payouts;
  var cTotal = 0, iTotal = 0;
  cPayouts.forEach(function (p) { cTotal += p.payout; });
  iPayouts.forEach(function (p) { iTotal += p.payout; });
  assert(near(cTotal, dm.current.k, 1), 'Current vault identity: payouts ~= k');
  assert(near(iTotal, dm.improved.k, 1), 'Improved vault identity: payouts ~= k');

  assert(resolveResult.improved.claimScale <= 1, 'claimScale <= 1');

  // In WTA, only the winning bin trader gets tokens; kernel distributes more broadly
  var cAlice = cPayouts.find(function (p) { return p.name === 'Alice'; });
  var iAlice = iPayouts.find(function (p) { return p.name === 'Alice'; });
  assert(cAlice && iAlice, 'Alice in both payouts');

  // ============================================================
  // 8. KERNEL WIDTH 0 = WTA
  // ============================================================
  suite('8. Kernel width 0 = WTA');
  var dm8 = new DualMarket();
  dm8.init(16, 0, 100, 5000, {}, 0);
  dm8.addTrader('Test', 10000);
  dm8.discreteBuy('Test', 5, 2000);
  var r8 = dm8.resolve(35);
  var cPay = r8.current.payouts.find(function (p) { return p.name === 'Test'; });
  var iPay = r8.improved.payouts.find(function (p) { return p.name === 'Test'; });
  assert(near(cPay.payout, iPay.payout, 1), 'W=0: payouts match (c=' + cPay.payout.toFixed(2) + ' i=' + iPay.payout.toFixed(2) + ')');

  // ============================================================
  // 9. KERNEL SHAPE
  // ============================================================
  suite('9. Kernel shape — triangular decay');
  var im9 = new ImprovedMarket(16, 0, 100, 5000, { kernelWidth: 3 });
  var kernel = im9.getSettlementKernel(8);
  assert(kernel.length === 16, 'Kernel has N entries');
  assert(kernel[8] === 1.0, 'Winning bin kernel weight = 1.0');
  assert(near(kernel[9], 0.75, 0.001), 'Adjacent bin (d=1): w = 1-1/4 = 0.75');
  assert(near(kernel[10], 0.5, 0.001), 'd=2: w = 1-2/4 = 0.5');
  assert(near(kernel[11], 0.25, 0.001), 'd=3: w = 1-3/4 = 0.25');
  assert(kernel[12] === 0, 'd=4 (outside W): w = 0');
  assert(kernel[0] === 0, 'Far bin: w = 0');

  // Edge bin kernel — should not go out of bounds
  var kernelEdge = im9.getSettlementKernel(0);
  assert(kernelEdge[0] === 1.0, 'Edge bin 0: kernel weight = 1.0');
  assert(near(kernelEdge[1], 0.75, 0.001), 'Edge: adjacent = 0.75');
  assert(near(kernelEdge[3], 0.25, 0.001), 'Edge: d=3 = 0.25');
  assert(kernelEdge[4] === 0, 'Edge: d=4 = 0');

  // Last bin
  var kernelLast = im9.getSettlementKernel(15);
  assert(kernelLast[15] === 1.0, 'Last bin: kernel weight = 1.0');
  assert(near(kernelLast[14], 0.75, 0.001), 'Last: d=1 = 0.75');
  assert(near(kernelLast[12], 0.25, 0.001), 'Last: d=3 = 0.25');

  // ============================================================
  // 10. KERNEL WIDTH LARGER THAN N
  // ============================================================
  suite('10. Large kernel width');
  var imBig = new ImprovedMarket(4, 0, 100, 5000, { kernelWidth: 10 });
  var kernelBig = imBig.getSettlementKernel(2);
  assert(kernelBig[2] === 1.0, 'Win bin = 1.0');
  // All bins within W=10, so all should be > 0
  for (var j = 0; j < 4; j++) {
    assert(kernelBig[j] > 0, 'Bin ' + j + ' weight > 0 when W > N (' + kernelBig[j].toFixed(4) + ')');
  }

  // ============================================================
  // 11. FEE MECHANICS
  // ============================================================
  suite('11. Fee mechanics — trade, LP share, redemption');
  var dmFee = new DualMarket();
  dmFee.init(16, 0, 100, 5000, { tradeFeeBps: 200, lpFeeSharePct: 50, redemptionFeeBps: 100 }, 2);
  dmFee.addTrader('Fiona', 20000);

  var buyFee = dmFee.discreteBuy('Fiona', 5, 10000);
  // 200 bps = 2% trade fee
  assert(buyFee.current.fee === Math.floor(10000 * 200 / 10000), 'Trade fee = 2% of gross (got ' + buyFee.current.fee + ')');
  assert(buyFee.current.fee === 200, 'Fee = 200');
  // LP fee share = 50% of fee
  assert(buyFee.current.lpFee === Math.floor(200 * 50 / 100), 'LP fee = 50% of trade fee (got ' + buyFee.current.lpFee + ')');
  assert(buyFee.current.lpFee === 100, 'lpFee = 100');
  // Net collateral = gross - fee
  assert(buyFee.current.net === 10000 - 200, 'Net = gross - fee');

  // Accumulated LP fees should track
  assert(near(dmFee.current.accumulatedLpFees, 100), 'Accumulated LP fees = 100 after one trade');

  // Sell: fee on collateral out
  var sellFee = dmFee.discreteSell('Fiona', 5, 500);
  assert(sellFee.current.fee > 0, 'Sell trade fee > 0');
  assert(sellFee.current.lpFee > 0, 'Sell LP fee > 0');
  assert(sellFee.current.collateralOut === sellFee.current.grossOut - sellFee.current.fee, 'Sell: net = gross - fee');

  // Redemption fee at resolution
  var rFee = dmFee.resolve(35);
  var fionaC = rFee.current.payouts.find(function (p) { return p.name === 'Fiona'; });
  assert(fionaC.fee > 0, 'Redemption fee applied at resolution');
  assert(near(fionaC.fee, fionaC.grossPayout * 100 / 10000, 0.01), 'Redemption fee = 1% of gross payout');
  assert(near(fionaC.payout, fionaC.grossPayout - fionaC.fee, 0.01), 'Payout = gross - redemption fee');

  // ============================================================
  // 12. LP OPERATIONS
  // ============================================================
  suite('12. LP operations — add/remove liquidity');
  var dmLp = new DualMarket();
  dmLp.init(16, 0, 100, 5000, { tradeFeeBps: 100, lpFeeSharePct: 50 }, 2);
  dmLp.addTrader('LPer', 20000);

  // Add liquidity
  var addResult = dmLp.addLiquidity('LPer', 5000);
  assert(!addResult.error, 'Add liquidity succeeded');
  assert(addResult.current.sharesReceived > 0, 'Received LP shares');
  assert(near(dmLp.current.k, 10000), 'k doubled to 10000');
  assert(near(ammInvariant(dmLp.current), dmLp.current.k, 0.01), 'AMM invariant holds after add LP');

  // LP fraction should be 50% (5000 of 10000)
  assert(near(addResult.current.poolFraction, 0.5, 0.01), 'Pool fraction = 50%');

  // Probabilities unchanged after proportional add
  var probsLP = dmLp.current.getProbabilities();
  assert(near(probsLP[0], 1 / 16, 0.001), 'Probs unchanged after uniform LP add');

  // Sync maintained
  sync = dmLp.verifySync();
  assert(sync.synced, 'Positions synced after add LP');

  // Trade to generate fees, then remove
  dmLp.addTrader('Trader1', 10000);
  dmLp.discreteBuy('Trader1', 5, 3000);

  var removeBefore = dmLp.getTraderBalance('LPer');
  var removeResult = dmLp.removeLiquidity('LPer', 5000);
  assert(!removeResult.error, 'Remove liquidity succeeded');
  assert(removeResult.current.sharesBurned > 0, 'Shares burned > 0');
  assert(removeResult.current.collateralOut > 0, 'Collateral returned > 0');
  assert(removeResult.current.totalPayout > 0, 'Total payout includes collateral + fees');
  assert(near(ammInvariant(dmLp.current), dmLp.current.k, 0.01), 'AMM invariant holds after remove LP');

  // Wallet increased
  var removeAfter = dmLp.getTraderBalance('LPer');
  assert(removeAfter.current > removeBefore.current, 'Wallet increased after LP removal');

  // ============================================================
  // 13. LP PORTFOLIO
  // ============================================================
  suite('13. LP portfolio — per-outcome payouts');
  var dmLpP = new DualMarket();
  dmLpP.init(16, 0, 100, 5000, { redemptionFeeBps: 100 }, 2);
  dmLpP.addTrader('T1', 10000);
  dmLpP.discreteBuy('T1', 5, 3000);

  // Current LP portfolio
  var lpPortC = dmLpP.current.getLpPortfolio('Creator');
  assert(lpPortC !== null, 'Current LP portfolio exists');
  assert(lpPortC.payoutPerOutcome.length === 16, 'payoutPerOutcome has N entries');
  assert(lpPortC.poolFraction === 1, 'Creator has 100% pool fraction');
  assert(lpPortC.shares > 0, 'Shares > 0');

  // WTA LP: payout should vary by bin — winning the bin with heavy trader holdings = less for LP
  assert(lpPortC.payoutPerOutcome[5] < lpPortC.payoutPerOutcome[0],
    'WTA LP: heavily-traded bin pays LP less (bin5=' + lpPortC.payoutPerOutcome[5].toFixed(0) +
    ' vs bin0=' + lpPortC.payoutPerOutcome[0].toFixed(0) + ')');

  // Improved LP portfolio
  var lpPortI = dmLpP.improved.getLpPortfolio('Creator');
  assert(lpPortI !== null, 'Improved LP portfolio exists');
  assert(lpPortI.payoutPerOutcome.length === 16, 'Improved payoutPerOutcome has N entries');

  // All LP portfolio
  var allLpC = dmLpP.current.getAllLpPortfolio();
  assert(allLpC.poolFraction === 1, 'All LP pool fraction = 1');
  assert(near(allLpC.deposited, lpPortC.deposited, 0.01), 'All LP deposited matches single LP when solo');

  // ============================================================
  // 14. PER-OUTCOME TRADER PAYOUTS
  // ============================================================
  suite('14. Per-outcome trader payouts');
  var dmPO = new DualMarket();
  dmPO.init(16, 0, 100, 5000, { redemptionFeeBps: 0 }, 3);
  dmPO.addTrader('Meg', 10000);
  dmPO.discreteBuy('Meg', 8, 3000);

  // Current: WTA, only winning bin pays
  var cPayouts14 = dmPO.current.getTraderPayoutPerOutcome('Meg');
  assert(cPayouts14 !== null, 'Current per-outcome payouts exist');
  assert(cPayouts14.length === 16, 'Has N entries');
  assert(cPayouts14[8] > 0, 'WTA: winning bin has payout');
  // WTA: all other bins should be 0 (only bin with holdings pays)
  var allOtherZero = true;
  for (var j = 0; j < 16; j++) {
    if (j !== 8 && cPayouts14[j] > 0.01) allOtherZero = false;
  }
  assert(allOtherZero, 'WTA: non-holding bins pay 0');

  // Improved: kernel spreads payout to neighbors
  var iPayouts14 = dmPO.improved.getTraderPayoutPerOutcome('Meg');
  assert(iPayouts14 !== null, 'Improved per-outcome payouts exist');
  assert(iPayouts14[8] > 0, 'Improved: winning bin has payout');
  assert(iPayouts14[7] > 0, 'Kernel: adjacent bin 7 has payout');
  assert(iPayouts14[9] > 0, 'Kernel: adjacent bin 9 has payout');
  assert(iPayouts14[8] > iPayouts14[7], 'Kernel: winning > adjacent');
  assert(iPayouts14[0] < 0.01, 'Kernel: far bin ~0');

  // ============================================================
  // 15. SOLVENCY — claimScale < 1
  // ============================================================
  suite('15. Solvency scaling (claimScale < 1)');
  var dmSol = new DualMarket();
  dmSol.init(8, 0, 100, 1000, {}, 4);  // wide kernel on few bins
  dmSol.addTrader('S1', 50000);
  dmSol.addTrader('S2', 50000);
  // Massive buys to inflate claims
  dmSol.discreteBuy('S1', 3, 20000);
  dmSol.discreteBuy('S2', 4, 20000);
  dmSol.discreteBuy('S1', 5, 10000);

  var rSol = dmSol.resolve(50);
  assert(rSol.improved.claimScale <= 1, 'claimScale <= 1: ' + rSol.improved.claimScale.toFixed(6));

  // Even with scaling, total payouts must not exceed k
  var totalPaySol = 0;
  rSol.improved.payouts.forEach(function (p) { totalPaySol += p.payout; });
  assert(totalPaySol <= dmSol.improved.k + 0.01, 'Total improved payouts <= k (total=' + totalPaySol.toFixed(2) + ' k=' + dmSol.improved.k.toFixed(2) + ')');

  // P&L accounting: netPnL = payout + received - spent
  rSol.improved.payouts.forEach(function (p) {
    if (p.type === 'Trader') {
      assert(near(p.netPnL, p.payout + p.received - p.spent, 0.01),
        p.name + ' PnL = payout + received - spent');
    }
  });

  // ============================================================
  // 16. BIN BOUNDARY MAPPING
  // ============================================================
  suite('16. Bin boundary mapping');
  var cm16 = new CurrentMarket(10, 0, 100, 1000, {});

  // Resolve at exact rangeMin
  var r16a = cm16.resolve(0);
  assert(r16a.winningBin === 0, 'value=rangeMin resolves to bin 0');

  // Reset for next test
  cm16 = new CurrentMarket(10, 0, 100, 1000, {});
  var r16b = cm16.resolve(100);
  assert(r16b.winningBin === 9, 'value=rangeMax resolves to last bin (clamped)');

  cm16 = new CurrentMarket(10, 0, 100, 1000, {});
  var r16c = cm16.resolve(50);
  assert(r16c.winningBin === 5, 'value=50 resolves to bin 5');

  cm16 = new CurrentMarket(10, 0, 100, 1000, {});
  var r16d = cm16.resolve(10);
  assert(r16d.winningBin === 1, 'value=10 (boundary) resolves to bin 1');

  // Negative range
  cm16 = new CurrentMarket(10, -50, 50, 1000, {});
  var r16e = cm16.resolve(0);
  assert(r16e.winningBin === 5, 'value=0 in [-50,50] resolves to bin 5');

  // ============================================================
  // 17. CONSERVATION LAW — total in = total out
  // ============================================================
  suite('17. Conservation law');
  var dmCons = new DualMarket();
  dmCons.init(16, 0, 100, 10000, { tradeFeeBps: 150, lpFeeSharePct: 40, redemptionFeeBps: 50 }, 2);
  dmCons.addTrader('A', 20000);
  dmCons.addTrader('B', 20000);
  dmCons.addTrader('C', 15000);

  dmCons.discreteBuy('A', 5, 5000);
  dmCons.distributionBuy('B', 60, 12, 8000);
  dmCons.discreteBuy('C', 10, 3000);
  dmCons.addLiquidity('C', 5000);
  dmCons.discreteSell('A', 5, 500);

  var rCons = dmCons.resolve(55);

  // For each engine: sum of all payouts + all wallet balances should equal initial total
  ['current', 'improved'].forEach(function (eng) {
    var totalPayouts = 0;
    rCons[eng].payouts.forEach(function (p) { totalPayouts += p.payout; });

    // Wallets after resolution: traders A, B, C
    var walletA = dmCons.traders['A'][eng + 'Wallet'];
    var walletB = dmCons.traders['B'][eng + 'Wallet'];
    var walletC = dmCons.traders['C'][eng + 'Wallet'];

    // Total money in system: initial liquidity + all trader initial balances
    var totalIn = 10000 + 20000 + 20000 + 15000;

    // Total money accounted for: wallets + unclaimed payouts
    // (payouts are what would be claimed; wallets hold already-returned collateral from sells)
    var totalAccountedFor = walletA + walletB + walletC + totalPayouts;

    // Protocol fees (non-LP share) are burned/kept by protocol, accounting for the gap
    var protocolFees = dmCons[eng].accumulatedLpFees;  // already distributed via LP payouts
    // The trade fees not routed to LP are "protocol revenue" and leave the system
    // We verify: totalIn >= totalAccountedFor (fees leak out)
    assert(totalAccountedFor <= totalIn + 0.01,
      eng + ': money out (' + totalAccountedFor.toFixed(0) + ') <= money in (' + totalIn + ')');
    assert(totalAccountedFor > totalIn * 0.9,
      eng + ': not more than 10% lost to fees');
  });

  // ============================================================
  // 18. DISTRIBUTION WEIGHT COMPUTATION
  // ============================================================
  suite('18. Distribution weight computation (_computeWeights)');
  var cm18 = new CurrentMarket(16, 0, 100, 5000, {});

  // Weights should be Gaussian-shaped, sum to SCALE_WEIGHT
  var W18 = cm18._computeWeights(50, 10);
  assert(W18 !== null, 'Weights computed for mu=50, sigma=10');
  var wSum18 = sumArray(W18);
  assert(near(wSum18, 1e9, 1), 'Weights sum to SCALE_WEIGHT (1e9)');

  // Peak should be near mu=50 (bin 8, center=53.125)
  var maxW = 0, maxIdx = 0;
  for (var j = 0; j < 16; j++) {
    if (W18[j] > maxW) { maxW = W18[j]; maxIdx = j; }
  }

  var buyBig = dmBig.discreteBuy('Big', 50, 5000);
  assert(!buyBig.error, 'Buy succeeds in large range (0-1M)');

  // ============================================================
  // SUMMARY
  // ============================================================
  var summaryClass = fail > 0 ? 'fail' : 'pass';
  log('<div class="summary"><span class="' + summaryClass + '">' + pass + ' passed, ' + fail + ' failed</span></div>');
  console.log('\n=== RESULTS: ' + pass + ' passed, ' + fail + ' failed ===');
})();
